name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build
        run: |
          xcodebuild build \
            -project DubNotes.xcodeproj \
            -scheme DubNotes \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO
      - name: Boot iPad simulator
        run: |
          set -e
          UDID=$(xcrun simctl list devices available | grep -m1 iPad | grep -oE '[0-9A-F]{8}-([0-9A-F]{4}-){3}[0-9A-F]{12}')
          if [ -z "$UDID" ]; then
            echo "No available iPad simulator found"
            exit 1
          fi
          echo "Using simulator $UDID"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
      - name: Install and launch app
        run: |
          set -e
          APP=$(ls -d build/Build/Products/*-iphonesimulator/*.app | head -n1)
          if [ -z "$APP" ]; then
            echo "Built .app not found"
            exit 1
          fi
          echo "Installing $APP"
          xcrun simctl install booted "$APP"
          xcrun simctl launch booted com.jamesli.dubnotes
      - name: Verify app is still running
        run: |
          set -e
          sleep 8
          xcrun simctl spawn booted launchctl list | grep dubnotes
      - name: Take screenshot
        run: |
          set -e
          mkdir -p screenshots
          xcrun simctl io booted screenshot screenshots/launch.png
          if [ ! -s screenshots/launch.png ]; then
            echo "Screenshot missing or empty"
            exit 1
          fi
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/
          retention-days: 3
          if-no-files-found: error
